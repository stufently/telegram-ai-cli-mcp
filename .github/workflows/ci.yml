# Third-party actions are pinned to a commit SHA, not a tag: tags on other
# people's repos are mutable (a maintainer can force-move `v7` to point at
# different, possibly compromised, code without our workflow file changing at
# all). The `# vX.Y.Z` comment next to each SHA is only a human-readable
# label; Actions never resolves it. Verified against the upstream repos on
# 2026-08-23:
#   actions/checkout      v7.0.1  -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-python   v7.0.0  -> 5fda3b95a4ea91299a34e894583c3862153e4b97
# Bumping either pin later requires re-verifying the SHA against the tag, not
# just editing the version comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable from release.yml, so a tagged release runs *this* matrix rather
  # than a copy of it. A copy is the failure mode worth avoiding: it drifts,
  # and the version that drifts is the one nobody looks at until a release
  # publishes something the tests it did not run would have caught.
  workflow_call:

# A second push to the same branch/PR supersedes the still-running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reuses the same `make lint` a developer runs locally (Dockerfile-free,
      # official ruff image, read-only mount) so CI and local checks can never
      # silently drift apart into two different lint configs.
      - run: make lint

  # The workflows themselves, so a broken release.yml is a red pull request and
  # not a failed tag. release.yml only runs on a tag, and a tag is a version
  # number spent; this is the only place its syntax and expressions are checked
  # before then. The image is pinned by digest (resolved from Docker Hub on
  # 2026-10-12): rhysd/actionlint 1.7.12.
  actionlint:
    name: lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every workflow file
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/repo:ro -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors requires-python's floor (3.12) through the pin used for the
        # Docker image and constraints.txt (3.14) — the whole supported range.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with pinned constraints
        run: python -m pip install -c constraints.txt ".[test]"
      - name: Run tests
        run: pytest -q

  smoke:
    name: smoke (MCP stdio handshake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -c constraints.txt .
      # Deliberately NOT just `python -c "import telegram_ai_cli_mcp.mcp_server"`:
      # an import proves the module parses, not that a client can actually
      # talk to the server. scripts/smoke_mcp.py launches `tg-ai mcp`, does
      # the real MCP initialize handshake, and asserts tools/list answers
      # within a timeout — the only way a background server that never exits
      # on its own can meaningfully fail this job.
      - name: MCP stdio smoke test
        run: python scripts/smoke_mcp.py

  # A release, rehearsed. The same commands release.yml runs to build the wheel,
  # the sdist and the .mcpb and to write checksums.txt, then the check a user
  # runs on the downloads: every line verifies, and every artifact has a line.
  # Nothing is uploaded or attested here — attestations need the release
  # workflow's OIDC token — but a checksum step that would fail on a tag fails
  # in the pull request first.
  release-artifacts:
    name: release artifacts (dry run + checksums)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install build backend
        run: python -m pip install --constraint constraints.txt build twine
      - name: Build distributions
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: python -m build --sdist --wheel --outdir dist/
      - name: Generate checksums (as release.yml does)
        run: |
          mkdir -p checksums
          (cd dist && sha256sum -- *) > checksums/checksums.txt
      - name: Build the mcpb bundle
        run: bash scripts/build-mcpb.sh
      - name: Add the mcpb bundle to the checksums (as release.yml does)
        run: bash scripts/mcpb-checksums.sh dist-mcpb checksums/checksums.txt
      - name: Verify the downloads the way a user would
        run: |
          mkdir release
          cp dist/* dist-mcpb/*.mcpb checksums/checksums.txt release/
          cd release
          cat checksums.txt
          sha256sum -c --strict checksums.txt
          artifacts="$(find . -maxdepth 1 -type f ! -name checksums.txt | wc -l)"
          lines="$(wc -l < checksums.txt)"
          if [ "$artifacts" != 3 ] || [ "$lines" != "$artifacts" ]; then
            echo "::error::expected 3 artifacts each with one checksum line, got $artifacts artifacts and $lines lines"
            exit 1
          fi

  container:
    name: container (build + non-root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime image
        run: docker build -f Dockerfile -t telegram-ai-cli-mcp:ci .
      - name: Verify the container does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id telegram-ai-cli-mcp:ci -u)"
          echo "container UID: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::container runtime user is root (UID 0)"
            exit 1
          fi
      - name: Verify the entrypoint actually runs
        # The image's ENTRYPOINT is ["tg-ai"], so arguments go straight to it.
        run: docker run --rm telegram-ai-cli-mcp:ci --help
      - name: Verify the default command serves MCP over stdio
        # The default CMD is ["mcp"]: registries such as Glama start the image
        # with no arguments and introspect it. No account, session or network
        # is needed to answer initialize and tools/list. Killing the `docker run`
        # client on a timeout does not stop the container, so it is named and
        # force-removed on exit.
        run: |
          name="tgai-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          python3 scripts/smoke_mcp.py \
            docker run --rm -i --network none --name "$name" telegram-ai-cli-mcp:ci

  transcribe-container:
    name: optional transcriber (build + contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the optional image
        run: docker build -f Dockerfile.transcribe -t telegram-ai-cli-mcp-transcribe:ci .
      - name: Verify non-root runtime
        run: |
          uid="$(docker run --rm --entrypoint id telegram-ai-cli-mcp-transcribe:ci -u)"
          test "$uid" != "0"
      - name: Missing model uses the documented exit status
        run: |
          set +e
          docker run --rm --network none telegram-ai-cli-mcp-transcribe:ci \
            transcribe --input /audio/absent.oga --max-seconds 1
          status="$?"
          set -e
          if [ "$status" != "3" ]; then
            echo "::error::expected missing-model exit 3, got $status"
            exit 1
          fi

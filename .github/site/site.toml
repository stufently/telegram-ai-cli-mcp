[[faq]]
q = "How do I let Claude read my Telegram?"
a = "Run tg-ai mcp and register it as an MCP server with Claude Code or Claude Desktop. The readonly profile is active by default and groups and channels are readable immediately; direct messages stay closed until you add specific chat ids to safety.read.dms.allow."

[[faq]]
q = "Is there an MCP server for Telegram user accounts?"
a = "Yes, this one. It is built on MTProto through Telethon, not the Bot API, so it can read existing chat history, resolve usernames and see who is in a group the way a human member's client can."

[[faq]]
q = "Can an AI agent send messages on my Telegram account through this?"
a = "Only after a two-step plan and apply. An MCP client without shell access cannot apply a plan. A client that also has a shell (Claude Code, Codex and similar) can run tg-ai plan apply itself, so for those the safety net is the audit log and rate limits, not a hard gate."

[[faq]]
q = "Is this a Telegram bot?"
a = "No. It automates a personal user account over MTProto. A Bot API bot is a different kind of Telegram entity with different limits and different visibility into chat history."

[[faq]]
q = "Will Telegram ban my account for using this?"
a = "Telegram can limit or ban any account it judges to be running abusive automation, whatever tool sent the requests. The tool is built around ordinary reading and occasional allowlisted sending; mass joins, high-volume sends and member scraping are not something it tries to make safe."

[[faq]]
q = "Which Python version do I need?"
a = "3.12 or newer; 3.12 to 3.14 are tested in CI. Linux is tested, macOS is expected to work but not tested, and Windows is not supported because session locking uses fcntl."
